<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>360MAX Comercios — Panel</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,Arial,sans-serif;color:#1f2937;background:#f5f3ff;min-height:100vh}
  header{background:linear-gradient(120deg,#4c1d95,#6d28d9);color:#fff;padding:16px 22px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 20px rgba(76,29,149,.3)}
  header .mark{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;border:1px solid rgba(255,255,255,.4)}
  header .info{flex:1;min-width:0}
  header .info .c{font-size:17px;font-weight:800}
  header .info .u{font-size:12.5px;opacity:.85}
  header button{background:#fff;color:#5b21b6;border:0;padding:9px 16px;border-radius:9px;font-weight:700;cursor:pointer;font-size:13px}
  header button:hover{background:#ede9fe}
  main{max-width:1100px;margin:0 auto;padding:22px}
  .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .toolbar input{flex:1;min-width:220px;padding:11px 14px;border:1.5px solid #e5e7eb;border-radius:11px;font-size:14.5px;background:#fff}
  .toolbar input:focus{outline:none;border-color:#7c3aed}
  .contador{font-size:13px;color:#6b7280;font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
  .card{background:#fff;border:1px solid #ece7fb;border-radius:14px;padding:15px;box-shadow:0 4px 14px rgba(76,29,149,.06)}
  .card .nombre{font-weight:700;font-size:14.5px;color:#312e81;line-height:1.25}
  .card .cat{font-size:11.5px;color:#8b5cf6;margin:5px 0 9px;text-transform:uppercase;letter-spacing:.4px}
  .card .precio{font-size:19px;font-weight:800;color:#4c1d95}
  .card .stock{margin-top:8px;font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:8px;display:inline-block;background:#ede9fe;color:#5b21b6}
  .card .stock.bajo{background:#fee2e2;color:#b91c1c}
  .vacio{display:none;text-align:center;color:#9ca3af;padding:50px 10px;font-size:15px}
  .aviso{margin-top:16px;padding:12px 16px;border-radius:11px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;font-size:13.5px}
  .foot{text-align:center;margin:26px 0 6px;font-size:11px;color:#a78bfa;letter-spacing:3px;font-weight:700}
</style>
</head>
<body>
  <header>
    <div class="mark">360</div>
    <div class="info">
      <div class="c" id="comercioNombre">Comercio</div>
      <div class="u">Sesión: <span id="usuarioNombre">—</span></div>
    </div>
    <button id="logout">Salir</button>
  </header>

  <main>
    <div class="toolbar">
      <input id="buscador" type="text" placeholder="Buscar producto…" autocomplete="off">
      <span class="contador" id="contador">—</span>
    </div>
    <div class="grid" id="catalogo"></div>
    <div class="vacio" id="vacio">No hay productos cargados todavía.</div>
    <div class="aviso">El stock se muestra en vivo desde la base de datos de 360MAX (Render).</div>
    <p class="foot">3 6 0 M A X</p>
  </main>

<script>
(async function(){
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  async function api(ruta, opciones){
    var r = await fetch(ruta, {
      method: (opciones && opciones.method) || 'GET',
      headers: { 'Content-Type':'application/json' },
      body: opciones && opciones.body ? JSON.stringify(opciones.body) : undefined,
      credentials: 'same-origin'
    });
    var d = {}; try { d = await r.json(); } catch(e){}
    return { status: r.status, data: d };
  }

  var s = await api('/api/sesion');
  if (s.status !== 200 || !s.data.ok){ window.location.href = '/'; return; }
  document.getElementById('comercioNombre').textContent = (s.data.comercio && s.data.comercio.nombre) || 'Comercio';
  document.getElementById('usuarioNombre').textContent = s.data.usuario.nombre || s.data.usuario.usuario;

  document.getElementById('logout').addEventListener('click', async function(){
    await fetch('/api/logout', { method:'POST', credentials:'same-origin' });
    window.location.href = '/';
  });

  var p = await api('/api/productos');
  if (p.status === 402){ window.location.href = '/suspension'; return; }
  var productos = (p.data && p.data.productos) || [];

  function render(list){
    var grid = document.getElementById('catalogo');
    document.getElementById('vacio').style.display = list.length ? 'none' : 'block';
    document.getElementById('contador').textContent = list.length + ' productos';
    grid.innerHTML = list.map(function(x){
      var precio = (x.precio_fijo != null && x.precio_fijo !== '') ? Number(x.precio_fijo) : Number(x.precio || 0);
      var stock = Number(x.stock || 0);
      var bajo = stock <= 0;
      return '<div class="card">'
        + '<div class="nombre">' + esc(x.nombre) + '</div>'
        + '<div class="cat">' + esc(x.categoria || '—') + '</div>'
        + '<div class="precio">$' + precio.toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2}) + '</div>'
        + '<div class="stock' + (bajo ? ' bajo' : '') + '">Quedan: ' + stock + '</div>'
        + '</div>';
    }).join('');
  }

  render(productos);
  document.getElementById('buscador').addEventListener('input', function(e){
    var q = e.target.value.toLowerCase();
    render(productos.filter(function(x){ return String(x.nombre).toLowerCase().indexOf(q) !== -1; }));
  });
})();
</script>
</body>
</html>
