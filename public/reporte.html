<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>360MAX Comercios — Reportes</title>
  <link rel="stylesheet" href="estilo.css">
  <style>
    body{font-family:Arial,sans-serif;color:#1f2937;background:#f5f3ff;margin:0;padding:20px}
    header{background:linear-gradient(120deg,#4c1d95,#6d28d9);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px}
    header .mark{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
    header .info{flex:1;min-width:0}
    header .info .c{font-size:15px;font-weight:800;line-height:1.1}
    header .info .u{font-size:11.5px;opacity:.85}
    main{max-width:900px;margin:0 auto;padding:16px}
    .card{background:#fff;border:1px solid #ece7fb;border-radius:14px;padding:13px;box-shadow:0 4px 14px rgba(76,29,149,.06);margin-bottom:12px}
    .card h2{color:#4c1d95}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
    .grid .num{font-size:22px;font-weight:800;color:#4c1d95}
    .grid .lbl{font-size:12px;color:#6b7280;text-transform:uppercase;letter-spacing:.4px}
  </style>
</head>
<body>
  <header>
    <div class="mark">360</div>
    <div class="info">
      <div class="c">Panel de Reportes</div>
      <div class="u">360MAX Comercios</div>
    </div>
  </header>
  <main>
    <div class="card">
      <h2>Resumen del día</h2>
      <div class="grid">
        <div><div class="num" id="total">$0</div><div class="lbl">Total ventas</div></div>
        <div><div class="num" id="ganancia">$0</div><div class="lbl">Ganancia</div></div>
        <div><div class="num" id="ventas">0</div><div class="lbl">Ventas</div></div>
      </div>
    </div>
    <div class="card">
      <h2>Datos de ejemplo</h2>
      <p style="color:#6b7280">Cargando datos desde el backend...</p>
    </div>
  </main>
  <script>
    (function(){
      var fDesde = document.getElementById('fDesde');
      var fHasta = document.getElementById('fHasta');
      var btnConsultar = document.getElementById('btnConsultar');
      var resumenCard = document.getElementById('resumenCard');
      var resumenGrid = document.getElementById('resumenGrid');
      var mediosGrid = document.getElementById('mediosGrid');

      function esc(s){ return String(s==null?'':s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
      function money(n){ var u=Number(n||0); return '$'+u.toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2}); }

      function loadReport(){
        var desde = fDesde.value || '';
        var hasta = fHasta.value || '';
        if(!desde || !hasta){ alert('Completá Desde y Hasta'); return; }
        resumenCard.style.display='none';
        resumenGrid.innerHTML='';
        mediosGrid.innerHTML='';
        fetch('/api/reportes/rango?desde='+encodeURIComponent(desde)+'&hasta='+encodeURIComponent(hasta), {credentials:'same-origin'})
          .then(function(r){ return r.json(); })
          .then(function(d){
            if(!d.ok){ alert(d.mensaje || 'Error de consulta'); return; }
            resumenGrid.innerHTML = '<div class="row"><span class="k">Total ventas</span><span class="v">'+money(d.total||0)+'</span></div>'
              + '<div class="row"><span class="k">Ganancia</span><span class="v">'+money(d.ganancia||0)+'</span></div>'
              + '<div class="row"><span class="k">Ventas</span><span class="v">'+(d.ventas||0)+'</span></div>'
              + '<div class="row"><span class="k">En rango</span><span class="v">'+(d.ventas_en_rango||0)+'</span></div>';
            resumenCard.style.display='block';
          })
          .catch(function(){ alert('Error de conexión'); });
      }

      btnConsultar.addEventListener('click', loadReport);
      if(fDesde){ fDesde.value = fDesde.value || new Date().toISOString().slice(0,10); }
      if(fHasta){ fHasta.value = fHasta.value || new Date().toISOString().slice(0,10); }
    })();
  </script>
</body>
</body>
</html>
